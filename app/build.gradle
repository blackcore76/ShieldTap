plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.blackcore.callblind'
    compileSdk 34

    defaultConfig {
        applicationId "com.blackcore.callblind"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def props = new Properties()
            def localFile = rootProject.file('local.properties')
            if (localFile.exists()) { props.load(localFile.newDataInputStream()) }
            storeFile file(props.getProperty('RELEASE_STORE_FILE', '../shieldtap-release.jks'))
            storePassword props.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias props.getProperty('RELEASE_KEY_ALIAS', '')
            keyPassword props.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
